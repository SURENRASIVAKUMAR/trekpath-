<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard — Trek Path</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    :root {
      --bg: #09090b;
      --glass: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
      --gold: #FFD700;
      --gold-dim: rgba(255, 215, 0, 0.15);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.6);
    }

    body {
      margin: 0; padding: 0;
      background-color: var(--bg);
      background-image: radial-gradient(circle at 50% 0%, rgba(255,215,0,0.05), transparent 40%),
                        radial-gradient(circle at 100% 100%, rgba(255,215,0,0.03), transparent 30%);
      color: var(--text);
      font-family: 'Raleway', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    h1, h2, h3, h4, h5, h6, .brand-logo {
      font-family: 'Cinzel', serif;
    }

    .brand-logo {
      font-size: 1.5rem; font-weight: 900; letter-spacing: 4px;
      background: linear-gradient(135deg, #FFD700, #FFEC8B);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 20px; text-align: center; display: block;
    }

    /* ── LOGIN SCREEN ── */
    #loginScreen {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100vh;
    }
    .login-box {
      background: var(--glass); border: 1px solid var(--glass-border);
      border-radius: 20px; padding: 40px; width: 100%; max-width: 400px;
      backdrop-filter: blur(10px); box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      text-align: center;
    }
    .login-box input {
      background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
      color: white; border-radius: 10px; padding: 12px 16px; width: 100%;
      margin-bottom: 20px; outline: none; font-family: inherit;
    }
    .login-box input:focus { border-color: rgba(255,215,0,0.5); }
    .btn-gold {
      background: linear-gradient(135deg, var(--gold), #FFEC8B);
      color: #111; border: none; padding: 12px; width: 100%;
      border-radius: 10px; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; cursor: pointer; transition: transform 0.2s;
    }
    .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,215,0,0.3); }

    /* ── DASHBOARD LAYOUT ── */
    #dashboardScreen { display: none; }
    
    .sidebar {
      width: 250px; position: fixed; top: 0; left: 0; height: 100vh;
      background: rgba(0,0,0,0.8); border-right: 1px solid var(--glass-border);
      padding: 30px 0; display: flex; flex-direction: column; z-index: 100;
      backdrop-filter: blur(10px);
    }
    .sidebar .brand-logo { margin-bottom: 40px; }
    .nav-btn {
      background: transparent; border: none; color: var(--muted);
      padding: 15px 30px; text-align: left; font-weight: 600; font-size: 0.9rem;
      letter-spacing: 1px; text-transform: uppercase; width: 100%; cursor: pointer;
      transition: all 0.2s; display: flex; align-items: center; gap: 10px;
    }
    .nav-btn:hover, .nav-btn.active { color: var(--gold); background: rgba(255,215,0,0.05); border-right: 3px solid var(--gold); }
    
    .main-content {
      margin-left: 250px; padding: 40px;
    }
    .page-title {
      font-size: 1.8rem; font-weight: 700; color: var(--gold); margin-bottom: 30px;
      letter-spacing: 2px;
    }

    /* ── DATA TABLES ── */
    .table-card {
      background: var(--glass); border: 1px solid var(--glass-border);
      border-radius: 16px; overflow: hidden; backdrop-filter: blur(10px);
    }
    table { width: 100%; border-collapse: collapse; }
    th {
      background: rgba(255,255,255,0.02); padding: 16px; text-align: left;
      font-size: 0.75rem; letter-spacing: 1px; text-transform: uppercase;
      color: var(--gold); border-bottom: 1px solid var(--glass-border);
    }
    td {
      padding: 16px; font-size: 0.85rem; color: var(--text);
      border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: top;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }

    .badge-gold {
      background: var(--gold-dim); color: var(--gold);
      padding: 4px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 700;
    }

    /* Modals for details */
    .modal-content {
      background: #111; border: 1px solid var(--gold);
      color: white; border-radius: 16px;
    }
    .modal-header { border-bottom: 1px solid var(--glass-border); }
    .modal-title { color: var(--gold); font-family: 'Cinzel', serif; }
    .modal-footer { border-top: 1px solid var(--glass-border); }

  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen">
    <div class="login-box">
      <span class="brand-logo">TREKPATH</span>
      <h5 style="margin-bottom:25px; color:var(--muted); font-size:0.9rem;">Admin Dashboard</h5>
      <form id="loginForm">
        <input type="text" style="-webkit-text-security: disc;" id="adminPassword" placeholder="Enter Admin Password" required />
        <button type="submit" class="btn-gold" id="loginBtn"><i class="fas fa-lock"></i> &nbsp;Access Secure Area</button>
        <div id="loginError" style="color:#ff8080; font-size:0.8rem; margin-top:15px; display:none;">Incorrect Password</div>
      </form>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboardScreen">
    <div class="sidebar">
      <span class="brand-logo" style="font-size:1.2rem;">TREKPATH<br><small style="font-size:0.6rem;letter-spacing:2px;color:white;">ADMIN</small></span>
      <button class="nav-btn active" onclick="showTab('planners', this)"><i class="fas fa-map-marked-alt"></i> Trip Plans</button>
      <button class="nav-btn" onclick="showTab('contacts', this)"><i class="fas fa-envelope"></i> Messages</button>
      <button class="nav-btn" onclick="showTab('reviews', this)"><i class="fas fa-star"></i> Reviews</button>
      <div style="flex-grow:1;"></div>
      <button class="nav-btn" onclick="logout()" style="color:#ff8080;"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>

    <div class="main-content">
      
      <!-- Planners Tab -->
      <div id="tab-planners" class="tab-pane" style="display:block;">
        <h2 class="page-title"><i class="fas fa-route"></i> Submitted Trip Plans</h2>
        <div class="table-card">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Client</th>
                <th>Destination</th>
                <th>Dates</th>
                <th>Budget</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="plannersTableBody">
              <tr><td colspan="6" style="text-align:center;color:var(--muted);">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Contacts Tab -->
      <div id="tab-contacts" class="tab-pane" style="display:none;">
        <h2 class="page-title"><i class="fas fa-envelope-open-text"></i> Contact Messages</h2>
        <div class="table-card">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Name</th>
                <th>Email</th>
                <th>Subject</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="contactsTableBody">
              <tr><td colspan="5" style="text-align:center;color:var(--muted);">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Reviews Tab -->
      <div id="tab-reviews" class="tab-pane" style="display:none;">
        <h2 class="page-title"><i class="fas fa-star-half-alt"></i> Testimonials</h2>
        <div class="table-card">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Name</th>
                <th>Rating</th>
                <th>Review</th>
              </tr>
            </thead>
            <tbody id="reviewsTableBody">
              <tr><td colspan="4" style="text-align:center;color:var(--muted);">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <!-- Detail Modal -->
  <div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle">Details</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="modalBody" style="font-size:0.9rem; line-height:1.7;">
          <!-- Content injected here -->
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API_BASE = '/api';
    let adminToken = localStorage.getItem('trekpath_admin_token');
    
    let allPlanners = [];
    let allContacts = [];

    window.onload = () => {
      if (adminToken) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('dashboardScreen').style.display = 'block';
        fetchDashboardData();
      }
    };

    // ── LOGIN ──
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw = document.getElementById('adminPassword').value;
      const btn = document.getElementById('loginBtn');
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
      
      try {
        const res = await fetch(`${API_BASE}/admin/verify`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw })
        });
        const data = await res.json();
        
        if (data.success) {
          adminToken = data.token;
          localStorage.setItem('trekpath_admin_token', adminToken);
          document.getElementById('loginScreen').style.display = 'none';
          document.getElementById('dashboardScreen').style.display = 'block';
          fetchDashboardData();
        } else {
          document.getElementById('loginError').style.display = 'block';
          btn.innerHTML = '<i class="fas fa-lock"></i> &nbsp;Access Secure Area';
        }
      } catch (err) {
        console.error(err);
        btn.innerHTML = '<i class="fas fa-lock"></i> &nbsp;Access Secure Area';
      }
    });

    function logout() {
      localStorage.removeItem('trekpath_admin_token');
      window.location.reload();
    }

    // ── TABS ──
    function showTab(tabId, btn) {
      document.querySelectorAll('.tab-pane').forEach(el => el.style.display = 'none');
      document.getElementById('tab-' + tabId).style.display = 'block';
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      btn.classList.add('active');
    }

    // ── DATA FETCHING ──
    async function fetchDashboardData() {
      const headers = { 'Authorization': `Bearer ${adminToken}` };
      
      try {
        // Planners
        const pRes = await fetch(`${API_BASE}/admin/planners`, { headers });
        if (pRes.status === 401) return logout();
        allPlanners = await pRes.json();
        renderPlanners();

        // Contacts
        const cRes = await fetch(`${API_BASE}/admin/contacts`, { headers });
        allContacts = await cRes.json();
        renderContacts();

        // Reviews (Public API)
        const rRes = await fetch(`${API_BASE}/testimonials`);
        const reviews = await rRes.json();
        renderReviews(reviews);
        
      } catch (err) {
        console.error('Error fetching data', err);
      }
    }

    function formatDate(iso) {
      if (!iso) return '-';
      return new Date(iso).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
    }

    function renderPlanners() {
      const tbody = document.getElementById('plannersTableBody');
      if (!allPlanners.length) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--muted);">No trip plans found.</td></tr>';
        return;
      }
      tbody.innerHTML = allPlanners.map((p, index) => `
        <tr>
          <td>${formatDate(p.created_at)}</td>
          <td><strong>${p.fullname}</strong><br><small class="text-muted">${p.email}</small></td>
          <td><span class="badge-gold">${p.destination}</span></td>
          <td>${formatDate(p.start_date)} - ${formatDate(p.end_date)}</td>
          <td>${p.budget}</td>
          <td><button class="btn btn-sm btn-outline-warning" onclick="viewPlanner(${index})">View Details</button></td>
        </tr>
      `).join('');
    }

    function renderContacts() {
      const tbody = document.getElementById('contactsTableBody');
      if (!allContacts.length) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--muted);">No messages found.</td></tr>';
        return;
      }
      tbody.innerHTML = allContacts.map((c, index) => `
        <tr>
          <td>${formatDate(c.created_at)}</td>
          <td><strong>${c.name}</strong><br><small class="text-muted">${c.email}</small></td>
          <td>${c.phone || '-'}</td>
          <td>${c.subject || 'General Inquiry'}</td>
          <td><button class="btn btn-sm btn-outline-warning" onclick="viewContact(${index})">Read Msg</button></td>
        </tr>
      `).join('');
    }

    function renderReviews(reviews) {
      const tbody = document.getElementById('reviewsTableBody');
      if (!reviews.length) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--muted);">No reviews found.</td></tr>';
        return;
      }
      tbody.innerHTML = reviews.map(r => `
        <tr>
          <td>${formatDate(r.created_at)}</td>
          <td><strong>${r.name}</strong></td>
          <td><span style="color:var(--gold)">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</span></td>
          <td style="max-width:300px;">"${r.review}"</td>
        </tr>
      `).join('');
    }

    // ── MODALS ──
    const modal = new bootstrap.Modal(document.getElementById('detailModal'));

    function viewPlanner(index) {
      const p = allPlanners[index];
      document.getElementById('modalTitle').innerHTML = `<i class="fas fa-route"></i> Trip Plan: ${p.fullname}`;
      document.getElementById('modalBody').innerHTML = `
        <div class="row mb-3">
          <div class="col-6"><strong>Email:</strong> ${p.email}</div>
          <div class="col-6"><strong>Phone:</strong> ${p.phone || '-'}</div>
        </div>
        <div class="row mb-3">
          <div class="col-6"><strong>Destination:</strong> <span class="badge-gold">${p.destination}</span></div>
          <div class="col-6"><strong>Dates:</strong> ${formatDate(p.start_date)} to ${formatDate(p.end_date)}</div>
        </div>
        <div class="row mb-3">
          <div class="col-4"><strong>Travelers:</strong> ${p.travelers}</div>
          <div class="col-4"><strong>Type:</strong> ${p.travel_type}</div>
          <div class="col-4"><strong>Language:</strong> ${p.language}</div>
        </div>
        <div class="row mb-3">
          <div class="col-6"><strong>Budget:</strong> ${p.budget}</div>
          <div class="col-6"><strong>Accommodation:</strong> ${p.accommodation}</div>
        </div>
        <div class="mb-3">
          <strong>Interests:</strong> ${p.interests && p.interests.length ? p.interests.join(', ') : 'None specified'}
        </div>
        <div class="p-3" style="background:rgba(255,255,255,0.05); border-radius:8px;">
          <strong>Special Requests/Notes:</strong><br>
          ${p.notes ? p.notes.replace(/\\n/g, '<br>') : 'None'}
        </div>
      `;
      modal.show();
    }

    function viewContact(index) {
      const c = allContacts[index];
      document.getElementById('modalTitle').innerHTML = `<i class="fas fa-envelope-open"></i> Message from ${c.name}`;
      document.getElementById('modalBody').innerHTML = `
        <div class="row mb-3">
          <div class="col-6"><strong>Email:</strong> ${c.email}</div>
          <div class="col-6"><strong>Phone:</strong> ${c.phone || '-'}</div>
        </div>
        <div class="row mb-3">
          <div class="col-6"><strong>Subject:</strong> ${c.subject || '-'}</div>
          <div class="col-6"><strong>Destination:</strong> ${c.destination || '-'}</div>
        </div>
        <div class="p-4" style="background:rgba(255,255,255,0.05); border-radius:8px; font-style:italic;">
          "${c.message.replace(/\\n/g, '<br>')}"
        </div>
      `;
      modal.show();
    }
  </script>
</body>
</html>
